<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CivicSync — Authority Portal Login</title>
  <link rel="icon" href="/static/assets/logo.png" />
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/pages.css" />
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <div class="container site-header__inner">
        <a href="/" class="brand">
          <img src="/static/assets/logo.png" alt="CivicSync" />
          <span>CivicSync</span>
        </a>
        <nav class="site-nav" aria-label="Primary">
          <a href="/">Report Issue</a>
          <a href="/track">Track Status</a>
        </nav>
      </div>
    </header>

    <main class="page-main">
      <div class="container" style="display: flex; justify-content: center;">
        <div style="max-width: 420px; width: 100%; padding-top: var(--space-xl);">
          <div class="hero" style="margin-bottom: var(--space-lg); text-align: left;">
            <span class="hero__eyebrow">Internal Access</span>
            <h1 class="type-headline-md">Authority Portal</h1>
            <p style="color: var(--color-on-surface-variant); margin-top: 8px;">
              Sign in to access the CivicSync Command Center. This area is for authorized civic
              authority personnel only.
            </p>
          </div>

          <div class="card">
            <div class="card__body">
              <form id="login-form" novalidate>
                <div class="field">
                  <label for="username-input">Username</label>
                  <input type="text" id="username-input" name="username" autocomplete="username" required />
                </div>
                <div class="field">
                  <label for="password-input">Password</label>
                  <input type="password" id="password-input" name="password" autocomplete="current-password" required />
                </div>

                <div id="login-notice" class="notice notice-error" hidden></div>

                <button type="submit" class="btn btn-primary btn-block" id="login-submit-button">
                  <span id="login-submit-label">Sign In</span>
                </button>
              </form>
            </div>
          </div>

          <p class="type-body-sm" style="color: var(--color-on-surface-variant); margin-top: var(--space-md); text-align: center;">
            Not an authority user? <a href="/" style="color: var(--color-action);">Return to the citizen site</a>.
          </p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <span>© 2026 CivicSync</span>
        <span>AI-assisted civic accountability platform</span>
      </div>
    </footer>
  </div>

  <script src="/static/js/config.js"></script>
  <script src="/static/js/utils.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/authority-login.js"></script>
</body>
</html>
